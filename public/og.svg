  <text x="1120" y="580" text-anchor="end" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Inter, Arial, sans-serif" font-size="20" fill="#d7b56d" font-weight="600" letter-spacing="2">ComissãoPro</text>
