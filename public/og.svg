  <text x="80" y="320" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#f5f5f7" letter-spacing="-2">ComissãoPro — Gestão de</text>
  <text x="80" y="390" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#f5f5f7" letter-spacing="-2">Comissões de Consórcio</text>

